name: Publicar test en GitHub Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar versión estable
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Descargar versión de pruebas
        uses: actions/checkout@v4
        with:
          ref: develop
          path: development

      - name: Preparar ambos entornos
        run: |
          mkdir -p site/test
          if [ -f production/index.html ]; then
            cp production/index.html site/index.html
          else
            cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Test · Versión estable</title></head>
          <body style="font-family:system-ui,sans-serif;max-width:700px;margin:4rem auto;padding:0 1rem">
          <h1>Versión estable pendiente</h1>
          <p>La versión de producción todavía no se ha publicado. El test está en fase de pruebas.</p>
          </body>
          </html>
          EOF
          fi
          cp development/index.html site/test/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar ambos entornos
        id: deployment
        uses: actions/deploy-pages@v4
